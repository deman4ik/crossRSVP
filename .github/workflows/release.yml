name: Validate CrossRSVP Release

# Build and validate the CrossRSVP images after a release is published. The
# GitHub Release is managed manually: locally verified firmware binaries and
# SHA256SUMS are attached by the release owner, while this workflow only keeps
# validation copies as Actions artifacts and can never overwrite that release.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pio_env: rsvp_x3_release
            device: x3
          - pio_env: rsvp_x4_release
            device: x4
          - pio_env: rsvp_x4pro_release
            device: x4pro
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          submodules: recursive

      - name: Validate CrossRSVP release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import configparser
          import os
          import re

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"v(\d+\.\d+\.\d+)", tag)
          if match is None:
              raise SystemExit(f"Release tag must be v<major>.<minor>.<patch>, got {tag!r}")

          parser = configparser.ConfigParser(interpolation=None)
          parser.read("platformio.ini")
          configured = parser.get("crossrsvp", "version", fallback="").strip()
          expected = match.group(1)
          if configured != expected:
              raise SystemExit(
                  f"crossrsvp.version ({configured!r}) does not match release tag ({expected!r})"
              )
          print(f"Validated CrossRSVP version {configured}")
          PY

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Build CrossRSVP
        run: pio run -e ${{ matrix.pio_env }} -j1

      - name: Validate packaged firmware
        id: asset
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          asset="crossrsvp-${{ matrix.device }}-v${version}.bin"
          package_dir="artifacts/crossrsvp-${{ matrix.device }}-v${version}/firmware"
          test -f "$package_dir/$asset"
          test -f "$package_dir/SHA256SUMS"
          (cd "$package_dir" && sha256sum -c SHA256SUMS)

          artifact_dir="ci-artifact"
          mkdir -p "$artifact_dir"
          cp "$package_dir/$asset" "$artifact_dir/$asset"
          cp "$package_dir/SHA256SUMS" "$artifact_dir/SHA256SUMS"
          echo "name=$asset" >> "$GITHUB_OUTPUT"
          echo "directory=$artifact_dir" >> "$GITHUB_OUTPUT"

      - name: Upload build validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.asset.outputs.name }}
          path: ${{ steps.asset.outputs.directory }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

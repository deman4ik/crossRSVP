name: Build experimental crossRSVP X3 candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x3-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build and package candidate
        run: pio run -e rsvp_x3_release -j1

      - name: Upload candidate and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: crossrsvp-x3-v0.1-experimental-${{ github.sha }}
          path: |
            artifacts/rsvp-x3-v0.1/firmware/crossrsvp-x3-v0.1-experimental.bin
            artifacts/rsvp-x3-v0.1/firmware/SHA256SUMS
            .pio/build/rsvp_x3_release/firmware.elf
            .pio/build/rsvp_x3_release/firmware.map
            .pio/build/rsvp_x3_release/partitions.bin
          if-no-files-found: error
          retention-days: 30
